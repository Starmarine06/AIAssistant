name: Build NAS image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.nas
      - nas/**
      - nas_bot.py
      - agent_core.py
      - claude_bridge.py
      - llm_providers.py
      - github_sync.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nas
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/starmarine06/aiassistant-nas:latest
            ghcr.io/starmarine06/aiassistant-nas:${{ github.sha }}
